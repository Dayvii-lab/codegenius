<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="CodePilot AI — your AI coding partner. Research, build, debug, and learn." />
  <title>CodePilot AI</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%236366f1'/><path d='M10 12l-3 4 3 4M22 12l3 4-3 4M14 22l4-12' stroke='white' stroke-width='2.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Conversations and navigation">
      <div class="sidebar__header">
        <div class="brand">
          <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true">
            <rect width="32" height="32" rx="8" fill="var(--accent)"/>
            <path d="M10 12l-3 4 3 4M22 12l3 4-3 4M14 22l4-12" stroke="white" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="brand__name">CodePilot AI</span>
        </div>
        <button class="icon-btn sidebar__close" id="closeSidebarBtn" aria-label="Close sidebar" title="Close sidebar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>

      <button class="btn btn--primary btn--block" id="newChatBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        New chat
      </button>

      <div class="sidebar__search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="searchInput" type="search" placeholder="Search conversations" aria-label="Search conversations" />
      </div>

      <nav class="sidebar__nav" aria-label="Conversation list">
        <div class="sidebar__section">
          <h2 class="sidebar__title">Recent</h2>
          <ul id="conversationList" class="conv-list"></ul>
          <p id="convEmpty" class="muted small">No conversations yet.</p>
        </div>
      </nav>

      <div class="sidebar__footer">
        <button class="side-link" id="settingsBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09a1.65 1.65 0 001.51-1 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
          Settings
        </button>
        <button class="side-link" id="themeBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
          Toggle theme
        </button>
        <a class="side-link" href="/api/health" target="_blank" rel="noopener">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
          Status
        </a>
      </div>
    </aside>

    <div class="sidebar-overlay" id="sidebarOverlay" hidden></div>

    <main class="main" role="main">
      <header class="topbar">
        <button class="icon-btn" id="openSidebarBtn" aria-label="Open sidebar" title="Open sidebar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <div class="topbar__title">
          <span id="chatTitle">New chat</span>
          <span id="statusBadge" class="badge" hidden></span>
        </div>
        <div class="topbar__actions">
          <button class="icon-btn" id="clearChatBtn" aria-label="Clear chat" title="Clear chat">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>
          </button>
        </div>
      </header>

      <section class="chat" id="chat" aria-live="polite">
        <div class="welcome" id="welcome">
          <div class="welcome__logo">
            <svg width="56" height="56" viewBox="0 0 32 32" aria-hidden="true">
              <rect width="32" height="32" rx="8" fill="var(--accent)"/>
              <path d="M10 12l-3 4 3 4M22 12l3 4-3 4M14 22l4-12" stroke="white" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <h1>Your AI coding partner.</h1>
          <p class="muted">Research ideas, build projects, debug code, and understand every step.</p>

          <div class="examples" id="examples">
            <button class="example" data-prompt="Build a complete responsive portfolio website with HTML, CSS, and vanilla JavaScript. Provide all files.">
              <strong>Build a website</strong>
              <span>Responsive portfolio in HTML/CSS/JS</span>
            </button>
            <button class="example" data-prompt="Create a browser-based Snake game in a single HTML file with vanilla JavaScript. Include keyboard and touch controls.">
              <strong>Create a game</strong>
              <span>Playable Snake in one HTML file</span>
            </button>
            <button class="example" data-prompt="Debug this JavaScript error and explain the root cause: 'Uncaught TypeError: Cannot read properties of undefined (reading map)'.">
              <strong>Debug my code</strong>
              <span>Explain and fix a JS error</span>
            </button>
            <button class="example" data-prompt="Explain the modern JavaScript features introduced since ES2020 with short examples.">
              <strong>Explain a topic</strong>
              <span>Modern JavaScript features</span>
            </button>
            <button class="example" data-prompt="Generate a complete Node.js + Express project structure for a REST API with a users resource.">
              <strong>Generate a project</strong>
              <span>Node + Express REST API</span>
            </button>
            <button class="example" data-prompt="Review this code for security, performance, and readability: function login(u,p){ return db.query('SELECT * FROM users WHERE u='+u+' AND p='+p); }">
              <strong>Review code</strong>
              <span>Security &amp; quality review</span>
            </button>
          </div>
        </div>
      </section>

      <form class="composer" id="composer" autocomplete="off">
        <div class="composer__attachments" id="attachments" hidden></div>

        <div class="composer__row">
          <button type="button" class="icon-btn" id="attachBtn" aria-label="Attach image" title="Attach image">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.5V7a4 4 0 00-4-4H7a4 4 0 00-4 4v10a4 4 0 004 4h5.5"/><path d="M3 16l4-4 5 5 3-3 4 4"/><circle cx="15.5" cy="8.5" r="1.5"/></svg>
            <input type="file" id="fileInput" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden />
          </button>

          <label class="switch" title="Research mode (uses web search)">
            <input type="checkbox" id="researchToggle" />
            <span class="switch__track"><span class="switch__thumb"></span></span>
            <span class="switch__label">Research</span>
          </label>

          <textarea
            id="messageInput"
            class="composer__input"
            placeholder="Ask CodePilot anything…  (Enter to send, Shift+Enter for newline)"
            rows="1"
            aria-label="Message"
          ></textarea>

          <button type="button" class="icon-btn" id="stopBtn" aria-label="Stop generating" title="Stop generating" hidden>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
          </button>

          <button type="submit" class="btn btn--primary send-btn" id="sendBtn" aria-label="Send message" title="Send" disabled>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
          </button>
        </div>

        <div class="composer__hint">
          <span id="composerStatus" class="muted small"></span>
        </div>
      </form>
    </main>

    <dialog class="modal" id="settingsModal" aria-labelledby="settingsTitle">
      <form method="dialog" class="modal__inner">
        <header class="modal__header">
          <h2 id="settingsTitle">Settings</h2>
          <button class="icon-btn" value="close" aria-label="Close settings">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </header>
        <section class="modal__body">
          <div class="field">
            <label for="settingTheme">Theme</label>
            <select id="settingTheme">
              <option value="dark">Dark</option>
              <option value="light">Light</option>
            </select>
          </div>
          <div class="field">
            <label for="settingStream">Streaming responses</label>
            <select id="settingStream">
              <option value="on">Enabled</option>
              <option value="off">Disabled</option>
            </select>
          </div>
          <div class="field">
            <label>Provider capabilities</label>
            <ul class="cap-list" id="capList"><li class="muted">Loading…</li></ul>
          </div>
        </section>
        <footer class="modal__footer">
          <button class="btn" value="close">Close</button>
        </footer>
      </form>
    </dialog>
  </div>

  <script src="/app.js" defer></script>
</body>
</html>
